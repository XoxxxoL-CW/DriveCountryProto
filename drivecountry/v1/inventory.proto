syntax = "proto3";

package drivecountry.v1;

option go_package = "github.com/XoxxxoL-CW/DriveCountryProto/gen/go/drivecountry/v1;drivecountryv1";

service InventoryService {
  rpc GetItems(GetItemsRequest) returns (GetItemsResponse);
  rpc GetItem(GetItemRequest) returns (GetItemResponse);
  rpc Eat(EatRequest) returns (EatResponse);
  rpc SaveItemTelegramFile(SaveItemTelegramFileRequest) returns (SaveItemTelegramFileResponse);
}

message ItemAction {
  string name = 1;
  string data = 2;
}

message Item {
  string guid = 1;
  string name = 2;
  int32 price = 3;
  string s3_key = 4;
  string telegram_file_id = 5;
  string telegram_file_unique_id = 6;
  bool can_transmitted = 7;
  int32 quantity = 8;
  int32 eat_value = 9;
  repeated ItemAction actions = 10;
}

message GetItemsRequest {
  int64 user_id = 1;
}

message GetItemsResponse {
  repeated Item items = 1;
}

message GetItemRequest {
  int64 user_id = 1;
  string item_guid = 2;
}

message GetItemResponse {
  Item item = 1;
  double user_energy = 2;
}

message EatRequest {
  int64 user_id = 1;
  string item_guid = 2;
}

message EatResponse {
  // Item is populated when the user still has remaining quantity. When the
  // last copy was consumed `consumed_last` is true and only `item_guid` is
  // set inside `item` — clients use that to render "last one eaten" banners
  // without another round-trip.
  Item item = 1;
  double user_energy = 2;
  bool consumed_last = 3;
}

message SaveItemTelegramFileRequest {
  string item_guid = 1;
  string telegram_file_id = 2;
  string telegram_file_unique_id = 3;
}

message SaveItemTelegramFileResponse {}
