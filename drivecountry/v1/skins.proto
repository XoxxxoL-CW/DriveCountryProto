syntax = "proto3";

package drivecountry.v1;

option go_package = "github.com/XoxxxoL-CW/drive-country-proto/gen/go/drivecountry/v1;drivecountryv1";

service SkinsService {
  rpc ListAvailableSkins(ListAvailableSkinsRequest) returns (ListAvailableSkinsResponse);
  rpc GetSkin(GetSkinRequest) returns (GetSkinResponse);
  rpc GetSkinForUser(GetSkinForUserRequest) returns (GetSkinForUserResponse);
  rpc BuySkin(BuySkinRequest) returns (BuySkinResponse);
  rpc SaveSkinTelegramFile(SaveSkinTelegramFileRequest) returns (SaveSkinTelegramFileResponse);
}

message Skin {
  int32 id = 1;
  string name = 2;
  int32 price = 3;
  int32 user_lvl = 4;
  string s3_key = 5;
  string telegram_file_id = 6;
  string telegram_file_unique_id = 7;
  string gender = 8;
}

message ListAvailableSkinsRequest {
  int64 user_id = 1;
}

message ListAvailableSkinsResponse {
  repeated Skin skins = 1;
}

message GetSkinRequest {
  int32 skin_id = 1;
}

message GetSkinResponse {
  Skin skin = 1;
}

message GetSkinForUserRequest {
  int64 user_id = 1;
  int32 skin_id = 2;
}

message GetSkinForUserResponse {
  Skin skin = 1;
}

message BuySkinRequest {
  int64 user_id = 1;
  int32 skin_id = 2;
}

message BuySkinResponse {
  Skin skin = 1;
}

message SaveSkinTelegramFileRequest {
  int32 skin_id = 1;
  string telegram_file_id = 2;
  string telegram_file_unique_id = 3;
}

message SaveSkinTelegramFileResponse {}
