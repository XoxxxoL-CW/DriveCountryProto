syntax = "proto3";

package drivecountry.v1;

option go_package = "github.com/XoxxxoL-CW/DriveCountryProto/gen/go/drivecountry/v1;drivecountryv1";

service EatStoreService {
  rpc ShowMenu(ShowMenuRequest) returns (ShowMenuResponse);
  rpc ShowItem(ShowItemRequest) returns (ShowItemResponse);
  rpc BuyItem(BuyItemRequest) returns (BuyItemResponse);
}

message Eat {
  string guid = 1;
  string name = 2;
  int32 price = 3;
  string s3_key = 4;
  string telegram_file_id = 5;
  string telegram_file_unique_id = 6;
  int32 eat_value = 7;
}

message ShowMenuRequest {
  int32 position_id = 1;
}

message ShowMenuResponse {
  repeated Eat items = 1;
}

message ShowItemRequest {
  string item_guid = 1;
  int64 user_id = 2;
}

message ShowItemResponse {
  Eat item = 1;
}

message BuyItemRequest {
  string item_guid = 1;
  int64 user_id = 2;
}

message BuyItemResponse {
  Eat item = 1;
}
